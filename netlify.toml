# Deploys are done from CI via `netlify deploy --dir=dist` (the GitHub Action
# builds first). No build command here, so the Netlify CLI uploads the
# prebuilt dist/ instead of trying to rebuild inside the deploy step.
[build]
  edge_functions = "netlify/edge-functions"
  publish = "dist"

# Rewrite only real application route families. Missing assets and scanner
# paths must retain 404 status instead of becoming successful HTML pageviews.
[[redirects]]
  from = "/search"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/search/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/about/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/feedback"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/feedback/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/sources"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/sources/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/faq"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/faq/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/org/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/offering/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
