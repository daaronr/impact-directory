name: Deploy to Netlify

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check rendered pages and sitemap
        run: npm run check:seo

      - name: Deploy to Netlify
        run: npx --yes netlify-cli@24.0.1 deploy --prod --dir=dist --site=78da1569-75bd-4690-8f8f-e20cd14b5720 --no-build --json > .netlify-deploy.json
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

      - name: Verify the published production deployment
        run: node scripts/verify_deployment.mjs
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
